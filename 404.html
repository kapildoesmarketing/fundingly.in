    <script>
        // Apply theme from localStorage or system preference immediately
        (function() {
            try {
                const saved = localStorage.getItem('fundingly_theme') || 'auto';
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (saved === 'auto' && isDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();

        // Deisgned by Kapil Pidhwani: Strict domain-based deep link router for GitHub Pages. Ceiling: Client-side fetch lookup. Upgrade path: Static page pre-generation.
        (async function resolveDomainRoute() {
            const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '').trim().toLowerCase();
            const ignored = [
                'index.html', 'about.html', 'contact.html', 'privacy-policy.html', 'terms.html', '404.html',
                'sitemap.xml', 'robots.txt', 'ads.txt', 'manifest.json', '.nojekyll', 'cname'
            ];
            
            if (!rawPath || ignored.includes(rawPath) || rawPath.startsWith('css/') || rawPath.startsWith('js/') || rawPath.startsWith('data/') || rawPath.startsWith('assets/')) {
                return;
            }

            const cleanDomainQuery = rawPath.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];

            try {
                const manifestRes = await fetch('data/manifest.json?t=' + Date.now(), { cache: 'no-cache' });
                if (!manifestRes.ok) return;
                const manifest = await manifestRes.json();
                const quarters = Array.isArray(manifest.quarters) ? manifest.quarters : [];

                let match = null;
                for (const q of quarters) {
                    try {
                        const qRes = await fetch('data/' + q.file + '?v=' + encodeURIComponent(manifest.updated_at || Date.now()));
                        if (!qRes.ok) continue;
                        const records = await qRes.json();
                        const list = Array.isArray(records) ? records : (records && Array.isArray(records.records) ? records.records : []);

                        // Strict Domain Matching: Only match against extractDomain(company_website)
                        match = list.find(item => {
                            if (!item || !item.company_website) return false;
                            try {
                                const url = item.company_website.trim().startsWith('http') ? item.company_website.trim() : 'https://' + item.company_website.trim();
                                const hostname = new URL(url).hostname.replace(/^www\./, '').toLowerCase();
                                return hostname === cleanDomainQuery;
                            } catch (e) {
                                return false;
                            }
                        });
                        if (match) break;
                    } catch (err) {
                        console.warn('Error reading quarter in 404 router:', q.file, err);
                    }
                }

                if (match) {
                    window.location.replace('/?domain=' + encodeURIComponent(cleanDomainQuery));
                } else {
                    const descEl = document.querySelector('.notfound-description');
                    if (descEl) {
                        descEl.innerHTML = `We scoured our venture dataset, but found no recorded funding rounds for domain <strong>${escapeHtml(cleanDomainQuery)}</strong>.`;
                    }
                }
            } catch (e) {
                console.warn('Domain deep-link lookup warning:', e);
            }

            function escapeHtml(str) {
                return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
        })();
