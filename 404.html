<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Fundingly</title>
    <meta name="description" content="The page you are looking for does not exist on fundingly.in.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <!-- Open Graph & Twitter Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fundingly.in/404.html">
    <meta property="og:title" content="404 - Page Not Found | Fundingly">
    <meta property="og:description" content="The page you are looking for does not exist on fundingly.in.">
    <meta property="og:image" content="https://fundingly.in/assets/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Deisgned by Kapil Pidhwani: Apple Design System 404 Not Found Page. Ceiling: Static client redirect. Upgrade path: Dynamic search route inference. */
        .notfound-wrapper {
            min-height: calc(100vh - 64px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .notfound-card {
            background: var(--color-surface);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-sheet);
            padding: 56px 48px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.04);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .notfound-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: var(--color-primary-subtle);
            color: var(--color-primary);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .notfound-badge .material-symbols-outlined {
            font-size: 16px;
        }

        .notfound-code {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--color-text-primary);
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, var(--color-primary) 0%, #5856d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .notfound-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text-primary);
            letter-spacing: -0.02em;
            margin: 0 0 12px 0;
        }

        .notfound-description {
            font-size: 15px;
            line-height: 1.6;
            color: var(--color-text-secondary);
            margin: 0 0 32px 0;
        }

        .notfound-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-notfound-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--color-primary);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .btn-notfound-primary:hover {
            background: var(--color-primary-hover);
            transform: translateY(-1px);
        }

        .btn-notfound-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--color-surface-secondary);
            color: var(--color-text-primary);
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            border: 1px solid var(--color-hairline);
            transition: background 0.15s ease;
        }

        .btn-notfound-secondary:hover {
            background: var(--color-surface-tertiary);
        }

        @media (max-width: 480px) {
            .notfound-card {
                padding: 40px 24px;
            }

            .notfound-code {
                font-size: 64px;
            }

            .notfound-title {
                font-size: 20px;
            }

            .notfound-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn-notfound-primary,
            .btn-notfound-secondary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
    <script>
        // Apply theme from localStorage or system preference immediately
        (function() {
            try {
                const saved = localStorage.getItem('fundingly_theme') || 'auto';
                const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (saved === 'auto' && isDark)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();

        // Deisgned by Kapil Pidhwani: Strict domain-based deep link router for GitHub Pages. Ceiling: Client-side fetch lookup. Upgrade path: Static page pre-generation.
        (async function resolveDomainRoute() {
            const rawPath = window.location.pathname.replace(/^\/+|\/+$/g, '').trim().toLowerCase();
            const ignored = [
                'index.html', 'privacy-policy.html', 'terms.html', '404.html',
                'sitemap.xml', 'robots.txt', 'ads.txt', 'manifest.json', '.nojekyll', 'cname'
            ];
            
            if (!rawPath || ignored.includes(rawPath) || rawPath.startsWith('css/') || rawPath.startsWith('js/') || rawPath.startsWith('data/') || rawPath.startsWith('assets/')) {
                return;
            }

            const cleanDomainQuery = rawPath.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];

            try {
                const res = await fetch('data/data.json');
                if (!res.ok) return;
                const data = await res.json();
                const records = Array.isArray(data) ? data : (data && Array.isArray(data.records) ? data.records : []);

                // Strict Domain Matching: Only match against extractDomain(company_website)
                const match = records.find(item => {
                    if (!item || !item.company_website) return false;
                    try {
                        const url = item.company_website.trim().startsWith('http') ? item.company_website.trim() : 'https://' + item.company_website.trim();
                        const hostname = new URL(url).hostname.replace(/^www\./, '').toLowerCase();
                        return hostname === cleanDomainQuery;
                    } catch (e) {
                        return false;
                    }
                });

                if (match) {
                    window.location.replace('/?domain=' + encodeURIComponent(cleanDomainQuery));
                } else {
                    const descEl = document.querySelector('.notfound-description');
                    if (descEl) {
                        descEl.innerHTML = `We scoured our venture dataset, but found no recorded funding rounds for domain <strong>${escapeHtml(cleanDomainQuery)}</strong>.`;
                    }
                }
            } catch (e) {
                console.warn('Domain deep-link lookup warning:', e);
            }

            function escapeHtml(str) {
                return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
        })();
    </script>
</head>

<body>
    <!-- Navigation Header (Frosted Glass) -->
    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="brand-title" style="text-decoration: none; color: inherit;">
                <img src="assets/favicon.svg" alt="Fundingly" class="brand-logo"
                    width="36" height="36">
                <span>Fundingly</span>
            </a>
        </div>
        <div class="nav-controls">
            <a href="index.html" class="btn-nav-about" style="text-decoration: none;">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
        </div>
    </header>

    <main class="notfound-wrapper">
        <div class="notfound-card">
            <div class="notfound-badge">
                <span class="material-symbols-outlined">search_off</span>
                <span>Deal Undisclosed</span>
            </div>
            <div class="notfound-code">404</div>
            <h1 class="notfound-title">Round Not Found</h1>
            <p class="notfound-description">
                We scoured every cap table and newsroom, but this page isn't in our dataset. It may have been moved, deleted, or never existed in the seed round.
            </p>
            <div class="notfound-actions">
                <a href="index.html" class="btn-notfound-primary">
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
                    <span>Back to Dashboard</span>
                </a>
                <a href="privacy-policy.html" class="btn-notfound-secondary">
                    <span class="material-symbols-outlined" style="font-size: 18px;">policy</span>
                    <span>Privacy Policy</span>
                </a>
            </div>
        </div>
    </main>
</body>

</html>
